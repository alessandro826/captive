<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN Gastzugang</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #F8F9FA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1A1A1A;
        }

        .container {
            text-align: center;
            background-color: #FFFFFF;
            padding: 40px 60px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
            color: #1A1A1A;
        }
        .logo img { max-width: 150px; height: auto; } 

        .message {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #6C757D;
        }

        .btn {
            display: inline-block;
            background-color: #1A1A1A;
            color: #FFFFFF;
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><img src="https://raw.githubusercontent.com/alessandro826/captive/main/IMG_6434.jpeg" alt="Logo"></div>
        <p class="message">Willkommen in unserem Netzwerk. Bitte bestätigen Sie, um den Gastzugang zu nutzen.</p>
        <a href="http://fritz.box" class="btn">Gastzugang nutzen</a>
    </div>
</body>
</html>
