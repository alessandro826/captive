<!DOCTYPE html>
<html lang="de">
<head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willkommen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #F8F9FA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1A1A1A;
            text-align: center;
        }
        .container {
            background-color: #FFFFFF;
            padding: 40px 60px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 20px;
            color: #1A1A1A;
        }
        p {
            font-size: 18px;
            color: #6C757D;
            margin: 10px 0;
            line-height: 1.5;
        }
        .info {
            font-weight: 500;
            color: #1A1A1A;
        }
        .datetime {
            margin-top: 30px;
            font-size: 16px;
            color: #6C757D;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Herzlich Willkommen</h1>
        <p>Standort: <span class="info">Tunnelweg 11, 72290 Loßburg</span></p>
        <div class="datetime" id="datetime"></div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            
            const dateStr = now.toLocaleDateString('de-DE', dateOptions);
            const timeStr = now.toLocaleTimeString('de-DE', timeOptions);
            
            document.getElementById('datetime').innerHTML = `<p>${dateStr}</p><p>${timeStr}</p>`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
